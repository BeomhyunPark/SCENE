<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<title>SCENE · README banner</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  .banner { position: relative; width: 1600px; height: 800px; overflow: hidden; background: #f8f9f7; color: #091213; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; }
  .panel { position: absolute; left: 1030px; top: 0; width: 570px; height: 800px; background: #090b0b; }
  .field { position: absolute; left: 985px; top: -22px; width: 660px; height: 760px; }
  .logo { position: absolute; left: 108px; top: 80px; width: 459.081px; height: 192px; background: white; transform: scale(.625); transform-origin: top left; }
  .symbol { position: absolute; left: 24px; top: 34px; width: 124px; height: 124px; }
  .wordmark { position: absolute; left: 182px; top: 72.26px; width: 253.081px; height: 47.488px; }
  .category { position: absolute; left: 108px; top: 226px; margin: 0; color: #3d4f4f; font-size: 18px; font-weight: 500; letter-spacing: 2px; }
  h1 { position: absolute; left: 108px; top: 284px; margin: 0; width: 860px; font-size: 64px; line-height: 1.22; font-weight: 700; letter-spacing: -2px; }
  .subtitle { position: absolute; left: 108px; top: 486px; margin: 0; color: #4d5c5c; font-size: 24px; line-height: 38px; }
  .footer { position: absolute; left: 108px; top: 696px; margin: 0; color: #4d5c5c; font-size: 19px; }
  .message { position: absolute; left: 1100px; top: 580px; width: 390px; }
  .message p { color: #8c9c99; font-size: 16px; letter-spacing: 1px; margin: 0 0 18px; }
  .message strong { color: #f7faf7; font-size: 34px; line-height: 1.45; font-weight: 700; }
</style>
<main class="banner">
  <div class="panel"></div>
  <img class="field" src="../assets/scene-geometric-field.svg" alt="" />
  <div class="logo" aria-label="SCENE">
    <img class="symbol" src="../assets/scene-symbol.svg" alt="" />
    <img class="wordmark" src="../assets/scene-wordmark.svg" alt="SCENE" />
  </div>
  <p class="category">CHURCH EVENT OPERATIONS</p>
  <h1>Church Event<br />Operations Platform</h1>
  <p class="subtitle">교회와 기독교 공동체의 행사를 위한 운영 플랫폼</p>
  <p class="footer">행사를 준비하는 시간부터, 함께하는 순간까지.</p>
  <div class="message">
    <p>MORE TIME TOGETHER</p>
    <strong>정보는 한곳에.<br />집중은 사람에게.</strong>
  </div>
</main>
</html>
