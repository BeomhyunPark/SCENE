# The due-handover job is called directly. A live trigger would complete past handovers that other
# tests leave as HANDOVER on purpose.
scene.handover.scheduler.enabled=false
# DEC-067. Development login exists on this profile. Deploy-profile tests set their own profile.
spring.profiles.active=test
# Signs check-in QR values in tests (DEC-071).
scene.checkin.code-secret=test-checkin-code-secret
# DEC-078. Every test shares one MockMvc address, so the address limits are out of the way here.
# Limit tests set their own numbers. A low bcrypt strength keeps submits fast.
scene.participant.submit-ip-limit=100000
scene.participant.ip-failure-limit=100000
scene.participant.bcrypt-strength=4
