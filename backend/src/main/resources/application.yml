# Shared settings. Datasource lives in a profile file.
# local talks to backend/compose.yaml and also loads db/seed. dev, stg, and prod read SCENE_DB_*
# from the environment. Hosting for those environments is not decided, so those files have no host or password.
spring:
  application:
    name: scene
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration
  session:
    # 30 minutes is Spring Session's library default. Session TTL is still OPEN in
    # security-privacy §2; this value is not a SCENE product decision.
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# DEC-067. Operator cookie SCENE_SESSION, participant cookie SCENE_PSESSION.
# Both are HttpOnly, Secure, and SameSite=Lax. The serializers set HttpOnly and Secure.
# scene_operator_session and scene_participant_session stay conceptual names in
# security-privacy §2 and are not cookie names.
# Session TTL is still OPEN. spring.session.timeout of 30 minutes is the library default.
# The CORS origin is not a SCENE frontend. dev, stg, and prod replace it from the environment.
scene:
  security:
    cors:
      allowed-origins: http://scene-frontend.placeholder.invalid
    session:
      operator-cookie-name: SCENE_SESSION
      participant-cookie-name: SCENE_PSESSION
      same-site: Lax

logging:
  structured:
    format:
      console: logstash

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: app.scene.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
