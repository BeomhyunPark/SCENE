# Shared settings. Datasource lives in a profile file.
# local talks to backend/compose.yaml and also loads db/seed. dev, stg, and prod read SCENE_DB_*
# from the environment. Hosting for those environments is not decided, so those files have no host or password.
spring:
  application:
    name: scene
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          # Google sign-in (#232, DEC-069). Real values come from the environment.
          google:
            client-id: ${SCENE_GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${SCENE_GOOGLE_CLIENT_SECRET:google-client-secret-not-set}
            scope: openid,email,profile
  # Invitation mail (#470). Used only when scene.mail.enabled is true. Any SMTP account works,
  # e.g. Gmail smtp.gmail.com:587 with an app password. Real values come from the environment.
  mail:
    host: ${SCENE_MAIL_HOST:}
    port: ${SCENE_MAIL_PORT:587}
    username: ${SCENE_MAIL_USERNAME:}
    password: ${SCENE_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  session:
    # DEC-067 Follow-up (2026-11-02). An operator session expires after 60 minutes
    # without a request. Participant session TTL is still OPEN (DEC-064).
    timeout: 60m
    jdbc:
      initialize-schema: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# DEC-067. Operator cookie SCENE_SESSION, participant cookie SCENE_PSESSION.
# Both are HttpOnly, Secure, and SameSite=Lax. The serializers set HttpOnly and Secure.
# scene_operator_session and scene_participant_session stay conceptual names in
# security-privacy §2 and are not cookie names.
# Operator session timeout is 60 minutes (spring.session.timeout above).
# The CORS origin is not a SCENE frontend. dev, stg, and prod replace it from the environment.
scene:
  # DEC-069. The first sign-in of this email creates this space with the user as OWNER, once.
  bootstrap:
    owner-email: ${SCENE_BOOTSTRAP_OWNER_EMAIL:}
    space-name: ${SCENE_BOOTSTRAP_SPACE_NAME:}
  # DEC-071. Signs the participant check-in QR value. Blank means no QR value verifies.
  # Changing it voids every QR already shown, so it does not change during an event.
  checkin:
    code-secret: ${SCENE_CHECKIN_CODE_SECRET:}
  # Invitation mail (#470). false (default): create and resend return the link once for the owner
  # to pass on. true: the link is mailed to the invited address through spring.mail and is not
  # returned. from and link-base-url must be set when true, or the server does not start.
  mail:
    enabled: ${SCENE_MAIL_ENABLED:false}
    from: ${SCENE_MAIL_FROM:}
    link-base-url: ${SCENE_MAIL_LINK_BASE_URL:}
  security:
    cors:
      allowed-origins: http://scene-frontend.placeholder.invalid
    session:
      operator-cookie-name: SCENE_SESSION
      participant-cookie-name: SCENE_PSESSION
      same-site: Lax

logging:
  structured:
    format:
      console: logstash

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: app.scene.common.mybatis
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # The mail server is not part of liveness. A send failure answers MAIL_SEND_FAILED instead.
    mail:
      enabled: false
