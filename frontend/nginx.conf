# One origin for pages and API, so SCENE_SESSION / SCENE_PSESSION cookies stay first-party.
# Cloudflare Tunnel ends HTTPS in front of this; the browser always sees https.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_read_timeout 30s;
  }

  # Spring Security OAuth2 paths for Google login (#232).
  location ~ ^/(oauth2|login/oauth2)/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routes. The fragment (#access key) never reaches the server.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
